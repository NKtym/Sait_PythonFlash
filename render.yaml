services:
  - type: web
    name: flask-lab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flask-lab-db
          property: connectionString

databases:
  - name: flask-lab-db
    plan: free
    databaseName: labdb
    user: labuser
